name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-lint-${{ runner.os }}-

      - run: pip install ruff clang-format
      - run: ruff check .

      # Only csrc/ is checked. The v1 kernels under src/legacy/ were moved there
      # unchanged and are kept for benchmarking, not further development.
      - name: clang-format --dry-run
        run: |
          files=$(find csrc -name '*.cu' -o -name '*.cpp' -o -name '*.h')
          echo "checking: $files"
          clang-format --dry-run --Werror $files

  build:
    name: compile without a GPU
    runs-on: ubuntu-latest
    # A devel image, not a runtime one: the extension needs nvcc and the CUDA
    # headers. No GPU is present and none is needed — this job proves the
    # kernels compile, which is the part of the build that can break silently
    # between commits on a machine that never runs them.
    container: nvidia/cuda:12.8.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-dev git
          python3 -m pip install --upgrade pip

      - name: Free disk space
        run: |
          df -h /
          rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          df -h /

      # The cu128 wheel and its nvidia-* dependencies are several gigabytes;
      # without this they are re-downloaded on every run. Keyed on the workflow
      # file, so the cache is only invalidated when the install step changes.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-cuda-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-cuda-

      # A CUDA-enabled torch, not the CPU wheel. The CPU wheel omits
      # c10/cuda/impl/cuda_cmake_macros.h, a header generated only for CUDA
      # builds, so csrc/ cannot even reach the compiler against it — and it ships
      # no libtorch_cuda to link. None of that needs a *device*: compiling and
      # linking a CUDA extension requires the toolkit and the libraries, never a
      # GPU, which is what this job proves.
      - name: Install torch with CUDA support
        run: pip3 install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Build the extension
        env:
          # The runner has no GPU to query, so the target architecture has to be
          # stated. 8.6 is the card the kernels are written for.
          TORCH_CUDA_ARCH_LIST: "8.6"
          MAX_JOBS: "2"
        run: python3 setup.py build_ext --inplace

      - name: Show what was built
        run: find . -name '*.so' -newer setup.py -print
