name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff clang-format
      - run: ruff check .

      # Only csrc/ is checked. The v1 kernels under src/legacy/ were moved there
      # unchanged and are kept for benchmarking, not further development.
      - name: clang-format --dry-run
        run: |
          files=$(find csrc -name '*.cu' -o -name '*.cpp' -o -name '*.h')
          echo "checking: $files"
          clang-format --dry-run --Werror $files

  build:
    name: compile without a GPU
    runs-on: ubuntu-latest
    # A devel image, not a runtime one: the extension needs nvcc and the CUDA
    # headers. No GPU is present and none is needed — this job proves the
    # kernels compile, which is the part of the build that can break silently
    # between commits on a machine that never runs them.
    container: nvidia/cuda:12.8.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-dev git
          python3 -m pip install --upgrade pip

      # CPU torch is enough: nvcc compiles the .cu sources against the CUDA
      # headers from the image, and the extension links against libtorch, which
      # the CPU wheel provides. Nothing here is executed.
      - name: Install CPU torch
        run: pip3 install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build the extension
        env:
          # The runner has no GPU to query, so the target architecture has to be
          # stated. 8.6 is the card the kernels are written for.
          TORCH_CUDA_ARCH_LIST: "8.6"
          MAX_JOBS: "2"
        run: python3 setup.py build_ext --inplace

      - name: Show what was built
        run: find . -name '*.so' -newer setup.py -print
